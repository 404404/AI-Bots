apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.conversationnotifications'
version = '0.1.0'

android {
  namespace 'expo.modules.conversationnotifications'
  defaultConfig { versionCode 1; versionName '0.1.0' }
}

def notificationsVersion = new groovy.json.JsonSlurper().parse(new File(
  ['node', '--print', "require.resolve('expo-notifications/package.json')"].execute(null, projectDir).text.trim()
)).version

dependencies {
  if (findProject(':expo-notifications')) {
    implementation project(':expo-notifications')
  } else {
    compileOnly "host.exp.exponent:expo.modules.notifications:${notificationsVersion}"
  }
  implementation 'androidx.core:core:1.17.0'
  implementation 'com.caverock:androidsvg-aar:1.4'
}
