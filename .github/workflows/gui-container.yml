name: GUI container

on:
  push:
    tags: ['gui-container-*']
  pull_request:
    paths:
      - '.dockerignore'
      - 'deploy/**'
      - 'packages/**'
      - 'scripts/dev-profile.mjs'
      - 'scripts/dev-instance.mjs'
      - 'scripts/e2e-cli-host-restart.mjs'
      - 'scripts/e2e-cli-readonly.mjs'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsdown.config.ts'
      - '.github/workflows/gui-container.yml'
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the current commit to GHCR after the image build succeeds
        type: choice
        options: [no, yes]
        default: no
        required: true
      confirmation:
        description: Type PUBLISH_GUI_IMAGE to authorize the GHCR write
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: gui-container-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Test first-start profile seed copy permissions
        run: node --test deploy/copy-profile-seed.test.mjs
      - name: Test loopback forwarding for authenticated online CLI
        run: node --test deploy/loopback-host-proxy.test.mjs
      - name: Test authenticated CLI host target validation
        run: node --test deploy/cli-host-target.test.mjs
      - name: Verify the Chromium user-namespace seccomp extension
        run: node --test deploy/chromium-userns-seccomp.test.mjs
      - name: Validate Compose files
        env:
          IMAGE_REF: ghcr.io/404404/ai-bots@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          docker compose -f deploy/compose.gk50.yml config --quiet
          docker compose -f deploy/compose.synology.yml config --quiet
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ai-bots-gui:ci
          cache-from: type=gha,scope=gui-container
          cache-to: type=gha,scope=gui-container,mode=max
      - name: Scan the runtime image for fixed or actionable high-severity vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ai-bots-gui:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Boot the container and verify shared Browser/Computer display and Chromium sandbox
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-gui-ci"
          sudo chown 10001:10001 "$RUNNER_TEMP/dsh-gui-ci"
          mkdir -p "$RUNNER_TEMP/dsh-cli-artifacts"
          sudo chown 10001:10001 "$RUNNER_TEMP/dsh-cli-artifacts"
          sudo chmod 0700 "$RUNNER_TEMP/dsh-cli-artifacts"
          docker run -d --name dsh-gui-ci \
            --user 10001:10001 \
            --shm-size 512m \
            --memory 2g --cpus 1.5 --pids-limit 512 \
            --security-opt no-new-privileges:true --cap-drop ALL \
            --security-opt "seccomp=$GITHUB_WORKSPACE/deploy/chromium-userns-seccomp.json" \
            -e PUBLIC_URL=http://127.0.0.1:20443 \
            -v "$RUNNER_TEMP/dsh-gui-ci:/data/dsh" \
            -v "$RUNNER_TEMP/dsh-cli-artifacts:/tmp/dsh-cli-artifacts" \
            ai-bots-gui:ci
          cleanup() {
            docker rm -f dsh-gui-ci-unconfined >/dev/null 2>&1 || true
            docker rm -f dsh-gui-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 90); do
            status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' dsh-gui-ci 2>/dev/null || true)
            [ "$status" = healthy ] && break
            [ "$status" = unhealthy ] && { docker logs dsh-gui-ci; exit 1; }
            sleep 2
          done
          [ "$(docker inspect --format '{{.State.Health.Status}}' dsh-gui-ci)" = healthy ] || { docker logs dsh-gui-ci; exit 1; }
          echo 'PASS: GUI container became healthy.'
          docker exec --user 10001:10001 dsh-gui-ci \
            unshare --user --map-root-user sh -c '[ "$(id -u)" -eq 0 ]'
          echo 'PASS: Chromium unprivileged user namespace is available with the default container AppArmor profile.'
          umask 077
          echo 'RUN: Browser/Computer shared display and Chromium sandbox acceptance with the production seccomp profile.'
          gui_hardened_status=0
          if docker exec --user 10001:10001 \
            -e DISPLAY=:99 \
            -e XAUTHORITY=/tmp/dsh-runtime/Xauthority \
            dsh-gui-ci node /opt/app/deploy/e2e-gui-shared-display.mjs \
            > "$RUNNER_TEMP/gui-hardened.json" 2> "$RUNNER_TEMP/gui-hardened.stderr"; then
            echo 'PASS: hardened Browser/Computer shared display and Chromium sandbox acceptance.'
            cat "$RUNNER_TEMP/gui-hardened.json"
          else
            gui_hardened_status=$?
            echo 'FAIL: hardened Browser/Computer shared display and Chromium sandbox acceptance; sanitized report follows.'
            cat "$RUNNER_TEMP/gui-hardened.json"
          fi
          if [ "$gui_hardened_status" -ne 0 ]; then
            echo 'RUN: one-variable diagnostic control with Docker outer seccomp unconfined; Chromium sandbox remains enabled and this container is never published.'
            mkdir -p "$RUNNER_TEMP/dsh-gui-ci-unconfined"
            sudo chown 10001:10001 "$RUNNER_TEMP/dsh-gui-ci-unconfined"
            docker run -d --name dsh-gui-ci-unconfined \
              --user 10001:10001 \
              --shm-size 512m \
              --memory 2g --cpus 1.5 --pids-limit 512 \
              --security-opt no-new-privileges:true --cap-drop ALL \
              --security-opt seccomp=unconfined \
              -e PUBLIC_URL=http://127.0.0.1:20443 \
              -v "$RUNNER_TEMP/dsh-gui-ci-unconfined:/data/dsh" \
              ai-bots-gui:ci >/dev/null
            unconfined_health=starting
            for attempt in $(seq 1 90); do
              unconfined_health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' dsh-gui-ci-unconfined 2>/dev/null || true)
              [ "$unconfined_health" = healthy ] && break
              [ "$unconfined_health" = unhealthy ] && break
              sleep 2
            done
            unconfined_status=1
            if [ "$unconfined_health" = healthy ]; then
              if docker exec --user 10001:10001 \
                -e DISPLAY=:99 \
                -e XAUTHORITY=/tmp/dsh-runtime/Xauthority \
                dsh-gui-ci-unconfined node /opt/app/deploy/e2e-gui-shared-display.mjs \
                > "$RUNNER_TEMP/gui-unconfined.json" 2> "$RUNNER_TEMP/gui-unconfined.stderr"; then
                unconfined_status=0
                echo 'PASS: diagnostic control Browser/Computer shared display and Chromium sandbox acceptance.'
              else
                echo 'FAIL: diagnostic control Browser/Computer shared display and Chromium sandbox acceptance.'
              fi
              cat "$RUNNER_TEMP/gui-unconfined.json"
            else
              echo "FAIL: diagnostic control container health status was $unconfined_health."
            fi
            echo "A/B result: production seccomp status=$gui_hardened_status; outer-seccomp-unconfined diagnostic status=$unconfined_status."
            docker rm -f dsh-gui-ci-unconfined >/dev/null 2>&1 || true
          fi
          umask 077
          echo 'RUN: seed a disposable Bot and DM through the authenticated DSH Host RPC for read-only CLI acceptance.'
          if docker exec --user 10001:10001 dsh-gui-ci \
            node /opt/app/deploy/seed-cli-acceptance.mjs \
            > "$RUNNER_TEMP/cli-fixture.json" 2> "$RUNNER_TEMP/cli-fixture.stderr"; then
            cat "$RUNNER_TEMP/cli-fixture.json"
          else
            echo 'FAIL: DSH-native CLI fixture seeding; sanitized result follows.'
            cat "$RUNNER_TEMP/cli-fixture.json"
            exit 1
          fi
          mapfile -t cli_fixture_ids < <(node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (report.schemaVersion !== 1 || report.status !== "passed") process.exit(1);
            if (typeof report.botId !== "string" || typeof report.channelId !== "string") process.exit(1);
            process.stdout.write(`${report.botId}\n${report.channelId}\n`);
          ' "$RUNNER_TEMP/cli-fixture.json")
          [ "${#cli_fixture_ids[@]}" -eq 2 ] || { echo 'FAIL: invalid sanitized CLI fixture IDs.'; exit 1; }
          cli_fixture_bot=${cli_fixture_ids[0]}
          cli_fixture_channel=${cli_fixture_ids[1]}
          echo 'RUN: authenticated online CLI before Host restart.'
          if docker exec --user 10001:10001 dsh-gui-ci \
            node /opt/app/deploy/cli-host-snapshot.mjs --launch /tmp/dsh-runtime/launch.json \
            > "$RUNNER_TEMP/cli-before-restart.json"; then
            :
          else
            result=$?
            echo 'FAIL: authenticated online CLI before Host restart; sanitized result follows.'
            if [ -s "$RUNNER_TEMP/cli-before-restart.json" ]; then
              cat "$RUNNER_TEMP/cli-before-restart.json"
            else
              echo '{"schemaVersion":1,"authenticated":false,"errorCode":"no-sanitized-result"}'
            fi
            exit "$result"
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (result.authenticated !== true || !Array.isArray(result.botIds)) process.exit(1);
          ' "$RUNNER_TEMP/cli-before-restart.json"
          echo 'PASS: authenticated online CLI before Host restart; sanitized response follows.'
          cat "$RUNNER_TEMP/cli-before-restart.json"
          echo 'RUN: read-only Bot, Session, Timeline, Activity, Assignment, cursor, and error-code CLI acceptance.'
          if docker exec --user 10001:10001 dsh-gui-ci \
            node /opt/app/deploy/run-cli-readonly-acceptance.mjs \
            --bot "$cli_fixture_bot" --channel "$cli_fixture_channel" --limit 20 \
            --output /tmp/dsh-cli-artifacts/cli-readonly-before.json \
            > "$RUNNER_TEMP/cli-readonly-before.json" 2> "$RUNNER_TEMP/cli-readonly-before.stderr"; then
            :
          else
            echo 'FAIL: authenticated read-only CLI before Host restart; sanitized result follows.'
            cat "$RUNNER_TEMP/cli-readonly-before.json"
            exit 1
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const checks = new Set(report.checks?.map((check) => check.name));
            for (const check of ["bot-list", "bot-detail", "sessions", "assignments", "activity", "channel-timeline", "coded-error", "invalid-cursor"])
              if (!checks.has(check)) process.exit(1);
            if (report.status !== "passed" || report.botId !== process.argv[2]) process.exit(1);
          ' "$RUNNER_TEMP/cli-readonly-before.json" "$cli_fixture_bot"
          echo 'PASS: authenticated read-only CLI commands returned bounded JSON before Host restart.'
          cat "$RUNNER_TEMP/cli-readonly-before.json"
          docker exec --user 10001:10001 dsh-gui-ci \
            cat /tmp/dsh-runtime/launch.json > "$RUNNER_TEMP/old-launch.json"
          started_before=$(docker inspect --format '{{.State.StartedAt}}' dsh-gui-ci)
          echo 'RUN: restart the Host container and wait for health recovery.'
          docker restart --time 30 dsh-gui-ci >/dev/null
          for attempt in $(seq 1 90); do
            status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' dsh-gui-ci 2>/dev/null || true)
            started_after=$(docker inspect --format '{{.State.StartedAt}}' dsh-gui-ci 2>/dev/null || true)
            [ "$started_after" != "$started_before" ] && [ "$status" = healthy ] && break
            [ "$status" = unhealthy ] && { docker logs dsh-gui-ci; exit 1; }
            sleep 2
          done
          [ "$started_after" != "$started_before" ] && [ "$status" = healthy ] || { docker logs dsh-gui-ci; exit 1; }
          echo 'PASS: Host container restarted and became healthy.'
          echo 'RUN: verify the old launch token is rejected.'
          if docker exec -i --user 10001:10001 dsh-gui-ci \
            node /opt/app/deploy/cli-host-snapshot.mjs --launch-stdin \
            < "$RUNNER_TEMP/old-launch.json" > "$RUNNER_TEMP/cli-stale-token.json"; then
            echo 'Old Host launch token unexpectedly authenticated after restart.'
            exit 1
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            const stale = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (stale.authenticated !== false || typeof stale.errorCode !== "string") process.exit(1);
          ' "$RUNNER_TEMP/cli-stale-token.json"
          echo 'PASS: old launch token rejected; sanitized error follows.'
          cat "$RUNNER_TEMP/cli-stale-token.json"
          echo 'RUN: authenticate with the refreshed launch token after restart.'
          if docker exec --user 10001:10001 dsh-gui-ci \
            node /opt/app/deploy/cli-host-snapshot.mjs --launch /tmp/dsh-runtime/launch.json \
            > "$RUNNER_TEMP/cli-after-restart.json"; then
            :
          else
            result=$?
            echo 'FAIL: refreshed launch token after Host restart; sanitized result follows.'
            if [ -s "$RUNNER_TEMP/cli-after-restart.json" ]; then
              cat "$RUNNER_TEMP/cli-after-restart.json"
            else
              echo '{"schemaVersion":1,"authenticated":false,"errorCode":"no-sanitized-result"}'
            fi
            exit "$result"
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            const before = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const after = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            if (before.authenticated !== true || after.authenticated !== true) process.exit(1);
            if (JSON.stringify(before.botIds) !== JSON.stringify(after.botIds)) process.exit(1);
          ' "$RUNNER_TEMP/cli-before-restart.json" "$RUNNER_TEMP/cli-after-restart.json"
          echo 'PASS: refreshed launch token authenticated and Bot IDs stayed stable.'
          cat "$RUNNER_TEMP/cli-after-restart.json"
          echo 'RUN: repeat read-only CLI acceptance and compare the stable Bot ID after Host restart.'
          if docker exec --user 10001:10001 dsh-gui-ci \
            node /opt/app/deploy/run-cli-readonly-acceptance.mjs \
            --bot "$cli_fixture_bot" --channel "$cli_fixture_channel" --limit 20 \
            --prior-report /tmp/dsh-cli-artifacts/cli-readonly-before.json \
            > "$RUNNER_TEMP/cli-readonly-after.json" 2> "$RUNNER_TEMP/cli-readonly-after.stderr"; then
            :
          else
            echo 'FAIL: authenticated read-only CLI after Host restart; sanitized result follows.'
            cat "$RUNNER_TEMP/cli-readonly-after.json"
            exit 1
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (report.status !== "passed" || report.hostRestartRecovery?.sameBotId !== true) process.exit(1);
          ' "$RUNNER_TEMP/cli-readonly-after.json"
          echo 'PASS: read-only CLI recovered after Host restart with the same Bot ID.'
          cat "$RUNNER_TEMP/cli-readonly-after.json"
          {
            echo '## Online CLI and Host restart acceptance'
            cat "$RUNNER_TEMP/cli-before-restart.json"
            cat "$RUNNER_TEMP/cli-stale-token.json"
            cat "$RUNNER_TEMP/cli-after-restart.json"
            cat "$RUNNER_TEMP/cli-readonly-before.json"
            cat "$RUNNER_TEMP/cli-readonly-after.json"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/old-launch.json" "$RUNNER_TEMP/cli-stale-token.json" \
            "$RUNNER_TEMP/cli-fixture.json" "$RUNNER_TEMP/cli-readonly-before.json" \
            "$RUNNER_TEMP/cli-readonly-after.json"
          if [ "$gui_hardened_status" -ne 0 ]; then
            echo 'FAIL: production Docker seccomp profile did not pass the GUI sandbox gate; the unconfined control is diagnostic only.'
            exit "$gui_hardened_status"
          fi

  publish:
    needs: build-check
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_image == 'yes') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/gui-container-'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Require explicit publish confirmation
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "PUBLISH_GUI_IMAGE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/404404/ai-bots:gui-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/404404/AI-Bots
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=gui-container
          cache-to: type=gha,scope=gui-container,mode=max
      - name: Record immutable image reference
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          IMAGE="ghcr.io/404404/ai-bots@$DIGEST"
          echo "Published: `$IMAGE`" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: `gui-sha-${GITHUB_SHA}`" >> "$GITHUB_STEP_SUMMARY"
