name: Standalone UI Browser QA

on:
  push:
    paths:
      - 'standalone/**'
      - '.github/workflows/standalone-ui-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-ui-qa-${{ github.sha }}
  cancel-in-progress: false

jobs:
  browser-ui:
    if: github.event.repository.fork == true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Install the standalone runtime dependencies
        run: npm ci --prefix standalone
      - name: Install the pinned Playwright Core and matching Chromium
        run: |
          npm ci --prefix standalone/browser
          npx --yes playwright@1.64.1 install --with-deps chromium
      - name: Check isolated launcher invariants
        run: node --test standalone/e2e/ui/harness.test.mjs
      - name: Run isolated real-browser UI QA
        env:
          UI_E2E_OUTPUT_DIR: ${{ runner.temp }}/standalone-ui-qa-${{ github.run_id }}-${{ github.run_attempt }}
        run: node standalone/e2e/ui/run.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: standalone-ui-qa-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/standalone-ui-qa-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
