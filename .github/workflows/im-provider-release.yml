name: qualified IM Provider release

on:
  push:
    tags: ['v-im-provider-*']

permissions:
  contents: read

concurrency:
  group: npm-prerelease-publication
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the reviewed tag on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("scripts/provider-release-plan.json")); if(process.env.TAG!==p.tag) throw new Error("Tag differs from reviewed plan")'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Download the exact qualified candidate asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id=$(node -p 'require("./scripts/provider-release-plan.json").candidateReleaseId')
          asset_id=$(node -p 'require("./scripts/provider-release-plan.json").candidateAssetId')
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/provider-release.json"
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("scripts/provider-release-plan.json")); const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/provider-release.json")); if(r.tag_name!==p.candidateTag||r.target_commitish!==p.productSource||!r.assets.some(a=>a.id===p.candidateAssetId&&a.name===p.filename)) throw new Error("Candidate differs from reviewed plan")'
          mkdir -p "$RUNNER_TEMP/provider"
          filename=$(node -p 'require("./scripts/provider-release-plan.json").filename')
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/provider/$filename"
          node scripts/npm-provider-release.mjs verify "$RUNNER_TEMP/provider/$filename"
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-provider
          path: ${{ runner.temp }}/provider/*.tgz
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          name: qualified-provider
          path: ${{ runner.temp }}/provider
      - name: Verify bytes before supplying publication credentials
        run: |
          filename=$(node -p 'require("./scripts/provider-release-plan.json").filename')
          node scripts/npm-provider-release.mjs verify "$RUNNER_TEMP/provider/$filename"
      - name: Publish only the qualified Provider and verify registry bytes
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          filename=$(node -p 'require("./scripts/provider-release-plan.json").filename')
          node scripts/npm-provider-release.mjs publish "$RUNNER_TEMP/provider/$filename"
      - uses: actions/upload-artifact@v4
        with:
          name: provider-publication-result
          path: ${{ runner.temp }}/provider/provider-publication-result.json
          if-no-files-found: error
          retention-days: 30
