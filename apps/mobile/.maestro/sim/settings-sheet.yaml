# Run on the assigned iOS device with an existing QA pairing and English locale.
# Does not erase data, enable notifications, or change the pairing.
appId: ai.botharness.deepseekbot.dev
---
- tapOn: 'Chats'
- tapOn: 'Settings'
- extendedWaitUntil:
    visible: 'Computers.*'
    timeout: 10000
- assertVisible: 'Done'
- assertVisible: 'Notifications'
- tapOn: 'Notifications'
- extendedWaitUntil:
    visible: 'Get a notification when a PersonaBot needs you or replies to you.*'
    timeout: 10000
- tapOn: 'Settings'
- assertVisible: 'Computers.*'
- tapOn: 'Done'
- assertVisible: 'Chats'
- assertNotVisible: 'Computers.*'
- tapOn: 'Settings'
- assertVisible: 'Computers.*'
- tapOn: 'Done'
