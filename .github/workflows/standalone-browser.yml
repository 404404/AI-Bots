name: Standalone Browser Candidate
on:
  push:
    branches: [feature/gui-container-codex-prototype]
    paths: ['standalone/browser/**', '.github/workflows/standalone-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: standalone-browser-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == '404404/AI-Bots' && github.ref == 'refs/heads/feature/gui-container-codex-prototype'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Browser module tests and syntax checks on pinned Node image
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/standalone/browser:/work" -w /work node:24.21.0-trixie-slim@sha256:173f125896c3b47ddf056734c7ea789d04595a6a08769a8f78e0df642781fb66 npm ci
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges:true -e BROWSER_WORKFLOW_PATH=/tmp/standalone-browser.yml -v "$PWD/standalone/browser:/work:ro" -v "$PWD/.github/workflows/standalone-browser.yml:/tmp/standalone-browser.yml:ro" -w /work node:24.21.0-trixie-slim@sha256:173f125896c3b47ddf056734c7ea789d04595a6a08769a8f78e0df642781fb66 sh -ec 'npm test && for file in src/*.mjs fixture/*.mjs scripts/*.mjs test/*.mjs; do node --check "$file"; done'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      # The Dockerfile runs apt-get upgrade/install from Debian repositories, so package versions can drift between workflow runs.
      # Build once per run, pin all OCI revision labels to github.sha, and gate these exact tar bytes across jobs.
      - name: Build fixed-revision images once for all gates
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          for target in worker proxy gateway fixture; do
            docker build --pull --platform linux/amd64 --build-arg "SOURCE_REVISION=$SOURCE_REVISION" --target "$target" -t "standalone-browser-$target:candidate" -f standalone/browser/Dockerfile standalone/browser
          done
          docker save standalone-browser-worker:candidate standalone-browser-proxy:candidate standalone-browser-gateway:candidate standalone-browser-fixture:candidate -o standalone-browser-images.tar
          sha256sum standalone-browser-images.tar > standalone-browser-images.tar.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: standalone-browser-images-${{ github.sha }}
          path: |
            standalone-browser-images.tar
            standalone-browser-images.tar.sha256
          if-no-files-found: error
          retention-days: 1

  scan:
    if: github.repository == '404404/AI-Bots' && github.ref == 'refs/heads/feature/gui-container-codex-prototype'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [worker, proxy, gateway, fixture]
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: standalone-browser-images-${{ github.sha }}
      - name: Verify and load exact build artifact
        run: |
          sha256sum --check standalone-browser-images.tar.sha256
          docker load --input standalone-browser-images.tar
      - name: Scan ${{ matrix.target }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: standalone-browser-${{ matrix.target }}:candidate
          format: table
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL,HIGH

  chromium-e2e:
    if: github.repository == '404404/AI-Bots' && github.ref == 'refs/heads/feature/gui-container-codex-prototype'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: standalone-browser-images-${{ github.sha }}
      - name: Run real Chromium sandbox and fixture E2E gates
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha256sum --check standalone-browser-images.tar.sha256
          docker load --input standalone-browser-images.tar
          export BROWSER_CONTROL_TOKEN="$(openssl rand -hex 32)"
          export BROWSER_PROXY_ADMIN_TOKEN="$(openssl rand -hex 32)"
          trap 'docker compose -f standalone/browser/deploy/compose.example.yml --profile e2e down -v --remove-orphans' EXIT
          docker compose -f standalone/browser/deploy/compose.example.yml --profile e2e up --no-build --abort-on-container-exit --exit-code-from e2e

  archive-candidate:
    if: github.repository == '404404/AI-Bots' && github.ref == 'refs/heads/feature/gui-container-codex-prototype'
    needs: [build, scan, chromium-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: standalone-browser-images-${{ github.sha }}
      - name: Create candidate identity record from gated image bytes
        env:
          SOURCE_REVISION: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTIONS: 'true'
        run: |
          set -euo pipefail
          sha256sum --check standalone-browser-images.tar.sha256
          mv standalone-browser-images.tar standalone-browser-candidate.tar
          docker load --input standalone-browser-candidate.tar
          node standalone/browser/scripts/candidate-record.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: standalone-browser-candidate-${{ github.sha }}
          path: |
            standalone-browser-candidate.tar
            standalone-browser-candidate.json
          if-no-files-found: error
          retention-days: 7
