# Opens the Host drawer from Me → Computers, switches computers and checks the Notifications row.
# -e FROM=<shown host> -e TO=<other host> -e BOT=<a PersonaBot on TO>
appId: ai.botharness.deepseekbot.dev
---
- tapOn: 'Me'
- extendedWaitUntil:
    visible: 'Computers.*'
    timeout: 10000
- assertVisible: '${FROM}.*'
- assertVisible:
    text: 'Notifications'
    below: 'Computers.*'
- tapOn: 'Computers.*'
- extendedWaitUntil:
    visible: 'Pair a new computer'
    timeout: 10000
- tapOn: '^${TO}, .*'
- extendedWaitUntil:
    notVisible: 'Pair a new computer'
    timeout: 10000
- tapOn: 'Home'
- extendedWaitUntil:
    visible: '${TO}, switch computer'
    timeout: 20000
- extendedWaitUntil:
    visible: ${BOT}
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
